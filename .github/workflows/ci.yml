name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '5.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Restore dependencies
        run: dotnet restore StacyClouds.C4Sharp.sln

      - name: Build
        run: dotnet build StacyClouds.C4Sharp.sln --no-restore --configuration Release

      - name: Pack NuGet packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          dotnet msbuild "/t:Pack" /p:Configuration=Release \
            /p:Version=${{ steps.gitversion.outputs.semVer }} \
            /p:NoBuild=true \
            StacyClouds.C4Sharp.Core/StacyClouds.C4Sharp.Core.csproj
          dotnet msbuild "/t:Pack" /p:Configuration=Release \
            /p:Version=${{ steps.gitversion.outputs.semVer }} \
            /p:NoBuild=true \
            StacyClouds.C4Sharp.Client/StacyClouds.C4Sharp.Client.csproj

      - name: Upload NuGet packages as artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ github.run_number }}
          path: |
            StacyClouds.C4Sharp.Core/bin/Release/*.nupkg
            StacyClouds.C4Sharp.Client/bin/Release/*.nupkg
          retention-days: 90

      - name: Run tests
        run: |
          dotnet test StacyClouds.C4Sharp.Core.Tests/StacyClouds.C4Sharp.Core.Tests.csproj --no-build --configuration Release
          dotnet test StacyClouds.C4Sharp.Client.Tests/StacyClouds.C4Sharp.Client.Tests.csproj --no-build --configuration Release

      - name: Install dotnet-stryker
        run: dotnet tool install --global dotnet-stryker

      - name: Run Stryker
        run: dotnet stryker

      - name: Upload Stryker reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-reports
          path: StrykerOutput
          retention-days: 7
