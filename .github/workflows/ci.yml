name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net9.0, net10.0, net11.0]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '5.x'

      - name: Setup .NET SDK
      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Restore
        run: dotnet restore StacyClouds.C4Sharp.CI.slnf -p:TargetFramework=${{ matrix.framework }}

      - name: Build
        run: dotnet build StacyClouds.C4Sharp.CI.slnf --no-restore -c Release -p:TargetFramework=${{ matrix.framework }}

      - name: Test
        run: dotnet test StacyClouds.C4Sharp.CI.slnf --no-build -c Release -p:TargetFramework=${{ matrix.framework }}

  making-app:
    runs-on: ubuntu-latest
      - name: Pack NuGet packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          dotnet msbuild "/t:Pack" /p:Configuration=Release \
            /p:Version=${{ steps.gitversion.outputs.semVer }} \
            /p:NoBuild=true \
            StacyClouds.C4Sharp.Core/StacyClouds.C4Sharp.Core.csproj
          dotnet msbuild "/t:Pack" /p:Configuration=Release \
            /p:Version=${{ steps.gitversion.outputs.semVer }} \
            /p:NoBuild=true \
            StacyClouds.C4Sharp.Client/StacyClouds.C4Sharp.Client.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
      - name: Upload NuGet packages as artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          dotnet-version: 11.0.x
          name: nuget-packages-${{ github.run_number }}
          path: |
            StacyClouds.C4Sharp.Core/bin/Release/*.nupkg
            StacyClouds.C4Sharp.Client/bin/Release/*.nupkg
          retention-days: 90

      - name: Restore making app
        run: dotnet restore StacyClouds.C4Sharp.Renderer.Web/StacyClouds.C4Sharp.Renderer.Web.csproj

      - name: Build making app
        run: dotnet build StacyClouds.C4Sharp.Renderer.Web/StacyClouds.C4Sharp.Renderer.Web.csproj --no-restore -c Release -p:TargetFramework=net11.0

  mutation-test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Install Stryker
        run: dotnet tool install --tool-path ./.dotnet-tools dotnet-stryker

      - name: Run Stryker (informational)
        run: bash scripts/run-stryker.sh
