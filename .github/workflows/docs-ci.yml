name: Docs CI

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/docs-ci.yml
      - .github/workflows/markdown-link-check-config.json
  pull_request:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/docs-ci.yml
      - .github/workflows/markdown-link-check-config.json

jobs:
  markdown-links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22

      - name: Validate markdown links
        run: |
          npm install -g markdown-link-check@3.12.2
          find docs -name "*.md" -print0 | xargs -0 -n1 markdown-link-check -q -c .github/workflows/markdown-link-check-config.json

  jekyll-build:
    runs-on: ubuntu-latest
    needs: markdown-links
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Configure Pages
        uses: actions/configure-pages@v5.0.0

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1.0.13
        with:
          source: docs
          destination: _site
