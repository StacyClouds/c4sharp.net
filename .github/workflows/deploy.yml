name: Publish NuGet packages

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '5.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3

      - name: Determine package version
        env:
          GITVERSION_MAJOR: ${{ steps.gitversion.outputs.major }}
          GITVERSION_MINOR: ${{ steps.gitversion.outputs.minor }}
          GITVERSION_PATCH: ${{ steps.gitversion.outputs.patch }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -z "${GITVERSION_PATCH:-}" ]; then
            echo "GitVersion patch output is empty. Check that the GitVersion step completed successfully and exposed outputs."
            exit 1
          fi
          PACKAGE_PATCH=$((GITVERSION_PATCH + GITHUB_RUN_NUMBER))
          PACKAGE_VERSION="${GITVERSION_MAJOR}.${GITVERSION_MINOR}.${PACKAGE_PATCH}"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo "Publishing package version: $PACKAGE_VERSION"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x

      - name: Restore packages
        run: dotnet restore StacyClouds.C4Sharp.CI.slnf

      - name: Build packages
        run: dotnet build StacyClouds.C4Sharp.CI.slnf --no-restore -c Release

      - name: Pack NuGet packages
        run: |
          dotnet pack StacyClouds.C4Sharp.Core/StacyClouds.C4Sharp.Core.csproj --no-build --no-restore -c Release -p:Version=${{ env.PACKAGE_VERSION }} -o ./artifacts/nuget
          dotnet pack StacyClouds.C4Sharp.Client/StacyClouds.C4Sharp.Client.csproj --no-build --no-restore -c Release -p:Version=${{ env.PACKAGE_VERSION }} -o ./artifacts/nuget
          dotnet pack StacyClouds.C4Sharp.Renderer/StacyClouds.C4Sharp.Renderer.csproj --no-build --no-restore -c Release -p:Version=${{ env.PACKAGE_VERSION }} -o ./artifacts/nuget
          dotnet pack StacyClouds.C4Sharp.Editor/StacyClouds.C4Sharp.Editor.csproj --no-build --no-restore -c Release -p:Version=${{ env.PACKAGE_VERSION }} -o ./artifacts/nuget

      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: StacyClouds

      - name: Publish to NuGet
        run: |
          dotnet nuget push ./artifacts/nuget/*.nupkg \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
