name: Deploy

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'CI run ID to deploy (from a push-to-main build). Find it in the Actions tab.'
        required: true
        type: string

jobs:
  publish:
    name: Publish NuGet Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Download NuGet packages from CI run
        uses: actions/download-artifact@v4
        with:
          pattern: nuget-packages-*
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: packages

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Publish to NuGet
        run: |
          dotnet nuget push packages/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
