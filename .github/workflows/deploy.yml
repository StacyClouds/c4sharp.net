name: Deploy

on:
  workflow_dispatch:

jobs:
  publish:
    name: Build and Publish NuGet Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x

      - name: Restore dependencies
        run: dotnet restore Structurizr.sln

      - name: Build and pack Core
        run: >
          dotnet msbuild
          "/t:Restore;Rebuild;Pack"
          /p:Configuration=Release
          /p:Version=${{ steps.gitversion.outputs.semVer }}
          Structurizr.Core/Structurizr.Core.csproj

      - name: Build and pack Client
        run: >
          dotnet msbuild
          "/t:Restore;Rebuild;Pack"
          /p:Configuration=Release
          /p:Version=${{ steps.gitversion.outputs.semVer }}
          Structurizr.Client/Structurizr.Client.csproj

      - name: Upload packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ steps.gitversion.outputs.semVer }}
          path: |
            Structurizr.Core/bin/Release/*.nupkg
            Structurizr.Client/bin/Release/*.nupkg
          retention-days: 30

      - name: Publish to NuGet
        run: |
          dotnet nuget push Structurizr.Core/bin/Release/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push Structurizr.Client/bin/Release/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
