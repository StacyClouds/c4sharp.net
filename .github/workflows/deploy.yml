name: Publish NuGet packages

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '5.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3

      - name: Determine package version
        env:
          GITVERSION_MAJOR: ${{ steps.gitversion.outputs.major }}
          GITVERSION_MINOR: ${{ steps.gitversion.outputs.minor }}
          GITVERSION_PATCH: ${{ steps.gitversion.outputs.patch }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -z "${GITVERSION_PATCH:-}" ]; then
            echo "GitVersion patch output is empty. Check that the GitVersion step completed successfully and exposed outputs."
            exit 1
          fi
          PACKAGE_PATCH=$((GITVERSION_PATCH + GITHUB_RUN_NUMBER))
          PACKAGE_VERSION="${GITVERSION_MAJOR}.${GITVERSION_MINOR}.${PACKAGE_PATCH}"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo "Publishing package version: $PACKAGE_VERSION"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore packages
        run: dotnet restore StacyClouds.C4Sharp.CI.slnf

      - name: Build packages
        run: dotnet build StacyClouds.C4Sharp.CI.slnf --no-restore -c Release

      - name: Regenerate API reference
        run: |
          dotnet docfx metadata docfx.json
          dotnet docfx build docfx.json

      - name: Write versioned release notes page
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
        run: |
          set -euo pipefail
          RELEASE_DATE=$(date -u +"%Y-%m-%d")
          NOTES_FILE="docs/api/release-notes-${PACKAGE_VERSION}.md"
          cat > "$NOTES_FILE" <<EOF
          ---
          title: Release ${PACKAGE_VERSION}
          ---

          # C4Sharp.NET ${PACKAGE_VERSION} — Release Notes

          Released: ${RELEASE_DATE}

          ## Package versions

          All packages in this release are published at version \`${PACKAGE_VERSION}\`:

          - [StacyClouds.C4Sharp.Core ${PACKAGE_VERSION}](https://www.nuget.org/packages/StacyClouds.C4Sharp.Core/${PACKAGE_VERSION})
          - [StacyClouds.C4Sharp.Client ${PACKAGE_VERSION}](https://www.nuget.org/packages/StacyClouds.C4Sharp.Client/${PACKAGE_VERSION})
          - [StacyClouds.C4Sharp.Renderer ${PACKAGE_VERSION}](https://www.nuget.org/packages/StacyClouds.C4Sharp.Renderer/${PACKAGE_VERSION})
          - [StacyClouds.C4Sharp.Editor ${PACKAGE_VERSION}](https://www.nuget.org/packages/StacyClouds.C4Sharp.Editor/${PACKAGE_VERSION})

          ## API reference

          Browse the [API reference](index.html) for the full public API at this version.
          EOF

      - name: Create pull request for API reference
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: regenerate API reference for v${{ env.PACKAGE_VERSION }}"
          branch: docs/api-reference-${{ env.PACKAGE_VERSION }}
          title: "docs: regenerate API reference for v${{ env.PACKAGE_VERSION }}"
          body: "Automated API reference update generated by the publish workflow for release v${{ env.PACKAGE_VERSION }}."
          add-paths: docs/

      - name: Pack NuGet packages
        run: |
          dotnet pack StacyClouds.C4Sharp.Core/StacyClouds.C4Sharp.Core.csproj --no-build --no-restore -c Release -p:Version=${{ env.PACKAGE_VERSION }} -o ./artifacts/nuget
          dotnet pack StacyClouds.C4Sharp.Client/StacyClouds.C4Sharp.Client.csproj --no-build --no-restore -c Release -p:Version=${{ env.PACKAGE_VERSION }} -o ./artifacts/nuget
          dotnet pack StacyClouds.C4Sharp.Renderer/StacyClouds.C4Sharp.Renderer.csproj --no-build --no-restore -c Release -p:Version=${{ env.PACKAGE_VERSION }} -o ./artifacts/nuget
          dotnet pack StacyClouds.C4Sharp.Editor/StacyClouds.C4Sharp.Editor.csproj --no-build --no-restore -c Release -p:Version=${{ env.PACKAGE_VERSION }} -o ./artifacts/nuget

      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: StacyClouds

      - name: Publish to NuGet
        run: |
          dotnet nuget push ./artifacts/nuget/*.nupkg \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
